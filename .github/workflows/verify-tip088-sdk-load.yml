name: Verify TIP-088 real SDK load compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sdk-load-only:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install exact observed VPS SDK versions
        run: |
          python -m pip install --only-binary=:all: MetaTrader5==5.0.6147 numpy==2.5.2 pytest==9.1.1
      - name: Verify filesystem and load-only scope
        run: python -m pytest -q tests/proofs/tip088_sdk_load/test_probe.py
      - name: Matched unrestricted and AppContainer SDK import
        shell: pwsh
        run: |
          $probePath = Join-Path $env:RUNNER_TEMP "tip088-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "TIP088_OUTPUT=$probePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python tests/proofs/tip088_sdk_load/run_probe.py --output "$probePath"
      - name: Preserve real load evidence, never qualification approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tip088-real-sdk-load-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.TIP088_OUTPUT }}/summary.json
            ${{ env.TIP088_OUTPUT }}/progress.json
            ${{ env.TIP088_OUTPUT }}/*-controller.json
            ${{ env.TIP088_OUTPUT }}/ipc/*.json
          if-no-files-found: error
          retention-days: 14
