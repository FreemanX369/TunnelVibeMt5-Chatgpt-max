name: Verify TIP-034 Bootstrap Completeness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-checkout:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FLEET_V1_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic bootstrap dependencies
        run: python -m pip install -c requirements-bootstrap.lock -e ".[test]"
      - name: Prepare measured Windows source temp
        shell: python
        run: |
          import json, os, tempfile
          from pathlib import Path
          receipt = {'schema': 'fleet.source-temp/1', 'status': 'RUNNING',
              'expected_sha': os.environ['FLEET_V1_EXPECTED_SHA'],
              'scope': 'CI_SOURCE_ENVIRONMENT_NOT_PHYSICAL_QUALIFICATION',
              'acl_policy': 'ORIGINAL_INHERITED_ACL_GUARDS_REQUIRED'}
          try:
              original = Path(tempfile.gettempdir())
              root = Path(os.environ['RUNNER_TEMP'])
              if root.is_symlink() or root.is_junction():
                  raise RuntimeError('SOURCE_RUNNER_TEMP_REPARSE')
              if original.stat().st_dev == root.stat().st_dev:
                  raise RuntimeError('SOURCE_DISTINCT_TEMP_VOLUME_NOT_OBSERVED')
              owned = Path(tempfile.mkdtemp(prefix='fleet-source-', dir=root))
              if owned.is_symlink() or owned.is_junction():
                  raise RuntimeError('SOURCE_TASK_TEMP_REPARSE')
              with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as environment:
                  for key in ('TMPDIR', 'TMP', 'TEMP'):
                      environment.write(key + '=' + str(owned) + '\n')
              receipt.update(status='PASS', temp_drive=owned.drive, temp_st_dev=owned.stat().st_dev,
                  previous_temp_drive=original.drive, previous_temp_st_dev=original.stat().st_dev)
          except BaseException as error:
              receipt.update(status='ERROR', error_type=type(error).__name__)
              raise
          finally:
              Path('source-temp-setup.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
      - name: Fresh import
        run: python -c "import vibemql5.adapters.mcp; print('IMPORT_PASS')"
      - name: Verify tool catalog authority
        run: python -c "from vibemql5.contracts import MCP_TOOL_COUNT,MCP_TOOL_NAMES,MCP_TOOL_CATALOG_SHA256; assert MCP_TOOL_COUNT==85; assert len(MCP_TOOL_NAMES)==85; assert len([x for x in MCP_TOOL_NAMES if x!='import_ex5_authorized_file'])==84; assert MCP_TOOL_CATALOG_SHA256=='915a87d829983cbb26125cc26350876e1ece5cdde95e77c76c98881e4b74fdef'; print('CATALOG_PASS')"
      - name: Compile Python tree
        run: python -c "import pathlib,py_compile; files=list(pathlib.Path('app/vibemql5').rglob('*.py')); [py_compile.compile(str(p),doraise=True) for p in files]; print('PY_COMPILE_PASS',len(files))"
      - name: Full unit suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTEST_ADDOPTS: '-o junit_logging=system-out -o junit_log_passing_tests=True'
          TIP077_AUTHORIZATION_SCOPE_PROBE: '1'
        run: python tests/proofs/fleet_v1/run_source.py --require-windows --unit-only --output bootstrap-source
      - name: Verify sanitized Windows config
        run: python -c "import json,pathlib; p=pathlib.Path('ops/windows/vibemql5.windows.json'); c=json.loads(p.read_text(encoding='utf-8')); assert c['tasks']['interactiveUser']==''; assert c['tunnel']['secretFile'].lower().endswith('.dpapi'); print('CONFIG_TEMPLATE_PASS')"
      - name: Windows bootstrap dry-run
        shell: pwsh
        run: |
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ops\windows\Install-VibeMQL5ScheduledTasks.ps1 -WhatIf 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch 'TIP034_BOOTSTRAP_DRY_RUN=PASS') { throw 'TIP034_DRY_RUN_MARKER_MISSING' }
          if ($output -notmatch 'SECRET_PROVISIONING=EXTERNAL_REQUIRED') { throw 'TIP034_SECRET_BOUNDARY_MARKER_MISSING' }
      - name: Verify bootstrap manifest and runbook
        run: python -c "import json,pathlib; m=pathlib.Path('bootstrap/TIP034C-bootstrap-manifest.json'); r=pathlib.Path('docs/bootstrap/WINDOWS-VPS-BOOTSTRAP.md'); data=json.loads(m.read_text(encoding='utf-8')); assert data['tip']=='TIP-034C'; assert data['external'] and data['exclude']; assert r.is_file() and r.stat().st_size>0; print('BOOTSTRAP_DOCS_PASS')"
      - name: Secret and runtime-state boundary
        run: python -c "import pathlib,subprocess; bad=[]; forbidden={'secrets','runs','state','backups','logs'}; suffixes={'.dpapi','.ex5'}; files=[pathlib.PurePosixPath(x) for x in subprocess.check_output(['git','ls-files'],text=True).splitlines()]; [bad.append(str(p)) for p in files if any(part.lower() in forbidden for part in p.parts) or p.suffix.lower() in suffixes]; assert not bad,bad; print('BOUNDARY_PASS')"
      - name: Retain Windows environment receipt
        if: always()
        shell: python
        run: |
          import shutil
          from pathlib import Path
          receipt = Path('source-temp-setup.json')
          if receipt.is_file():
              destination = Path('bootstrap-source')
              destination.mkdir(exist_ok=True)
              shutil.copyfile(receipt, destination / 'temp-setup.json')
      - name: Preserve bounded unit receipts, progress, JUnit and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: bootstrap-source/
          retention-days: 14
          if-no-files-found: error
