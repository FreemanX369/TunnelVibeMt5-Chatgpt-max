name: Verify TIP-053 Deep Update

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked runtime and editable package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-bootstrap.lock
          python -m pip install -e . --no-deps
      - name: Compile candidate Python surface
        shell: pwsh
        run: |
          python -m py_compile app/vibemql5/backend_admin/core.py app/vibemql5/backend_admin/test_run_worker.py app/vibemql5/backend_admin/tools.py app/vibemql5/core/artifacts.py app/vibemql5/core/live_terminal.py app/vibemql5/core/facade.py app/vibemql5/core/compiler.py app/vibemql5/parsers/report.py app/vibemql5/adapters/mcp.py
      - name: Run unit suite
        shell: pwsh
        run: python -m pytest -q tests/unit
