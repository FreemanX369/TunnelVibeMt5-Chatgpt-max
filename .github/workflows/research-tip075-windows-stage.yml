name: Research TIP075 fixed Windows pipeline stages

on:
  pull_request:
    branches: [feat/fleet-v1-continuous-source-20261003]
    paths:
      - 'research/windows_stage/**'
      - '.github/workflows/research-tip075-windows-stage.yml'

permissions:
  contents: read

jobs:
  fixed-source-timing:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: research
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: f5ee95360acd732e3ccb81730e8a288adb94e4e1
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the original locked source dependencies
        run: python -m pip install -c source/requirements-bootstrap.lock pytest==9.1.1 mcp==2.1.1 cryptography==50.0.1
      - name: Run observer controls
        env:
          PYTHONPATH: research/research/windows_stage
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q research/research/windows_stage --junitxml=windows-stage-evidence/observer-controls.junit.xml
      - name: Run the full fixed original Windows unit suite once
        run: python research/research/windows_stage/run_research.py --source source --output windows-stage-evidence
      - name: Preserve research output even when original tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tip075-windows-stage-research-${{ github.event.pull_request.head.sha }}
          path: windows-stage-evidence/
          retention-days: 14
          if-no-files-found: error
