name: Research Windows storage path crossover

on:
  pull_request:
    branches: [research/release-resume-20261014-r1]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  storage-crossover:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FLEET_V1_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      TIP077_AUTHORIZATION_SCOPE_PROBE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: '-o junit_logging=system-out -o junit_log_passing_tests=True'
      PYTEST_PLUGINS: ''
      PYTEST_CURRENT_TEST: ''
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing locked test dependencies
        run: python -m pip install -c requirements-bootstrap.lock pytest==9.1.1 mcp==2.1.1 cryptography==50.0.1
      - name: Observe three fixed storage arms without changing original tests
        run: python docs/fleet-v1/research/storage-crossover-20261015/run_probe.py --output storage-crossover
      - name: Preserve every arm including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-storage-crossover-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage-crossover/
          retention-days: 14
          if-no-files-found: error
